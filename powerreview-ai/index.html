<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PowerReview AI — 电力试验报告智能审核工具</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg:        #f3f4f6;
      --surface:   #ffffff;
      --fg:        #1f2937;
      --muted:     #6b7280;
      --border:    #e5e7eb;
      --accent:    #1e3a5f;

      --status-pass:  #22c55e;
      --status-warn:  #f59e0b;
      --status-fail:  #ef4444;
      --status-info:  #3b82f6;

      --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 4%, transparent);
      --fail-soft:   color-mix(in oklch, var(--status-fail) 10%, transparent);
      --warn-soft:   color-mix(in oklch, var(--status-warn) 10%, transparent);
      --pass-soft:   color-mix(in oklch, var(--status-pass) 10%, transparent);

      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --radius:      8px;
      --radius-lg:   12px;
      --sidebar-w:   220px;
      --topnav-h:    56px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── layout ─── */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w);
      background: var(--accent);
      color: #fff;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 20;
    }
    .sidebar-brand {
      height: var(--topnav-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      font-weight: 600;
      font-size: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-menu { padding: 12px 0; flex: 1; overflow-y: auto; }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      margin: 2px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      opacity: 0.75;
      transition: all .15s;
    }
    .sidebar-item:hover, .sidebar-item.active {
      opacity: 1;
      background: rgba(255,255,255,0.08);
    }
    .sidebar-item.active { font-weight: 500; }
    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      opacity: 0.5;
    }
    .main-area {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
    }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .topnav {
      height: var(--topnav-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .page-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* ─── components ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .card + .card { margin-top: 16px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--fg);
      margin-top: 4px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .12s;
      background: transparent;
      color: var(--fg);
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--bg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--muted); }
    .btn-ghost { border-color: transparent; }
    .btn-ghost:hover { background: var(--fg-soft); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-lg { padding: 10px 24px; font-size: 14px; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag-pass { background: var(--pass-soft); color: #166534; }
    .tag-warn { background: var(--warn-soft); color: #92400e; }
    .tag-fail { background: var(--fail-soft); color: #991b1b; }

    .ds-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ds-table th, .ds-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .ds-table th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; background: var(--bg); }
    .ds-table tbody tr:hover { background: var(--fg-soft); }
    .ds-table .num { font-family: var(--font-mono); text-align: right; }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .input {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--fg); font: inherit; font-size: 13px;
    }
    .input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      background: var(--surface);
    }
    .upload-zone:hover { border-color: var(--accent); background: var(--accent-soft); }

    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width .3s;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }
    .badge-fail { background: var(--status-fail); }
    .badge-warn { background: var(--status-warn); }
    .badge-pass { background: var(--status-pass); }

    .chart-placeholder {
      height: 180px;
      background: var(--bg);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* ─── login page ─── */
    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 460px;
    }
    .login-brand {
      background: linear-gradient(145deg, #1e3a5f 0%, #0f1f35 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
    }
    .login-form-wrap {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
    }
    .role-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .role-option {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      transition: all .12s;
    }
    .role-option:hover { border-color: var(--accent); }
    .role-option.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    /* ─── detail page specific ─── */
    .result-banner {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .result-block {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius-lg);
      text-align: center;
      color: #fff;
    }
    .result-block.fail { background: var(--status-fail); }
    .result-block.warn { background: var(--status-warn); }
    .result-block.pass { background: var(--status-pass); }
    .result-block .num { font-size: 32px; font-weight: 700; }
    .result-block .lbl { font-size: 12px; opacity: 0.9; margin-top: 4px; }

    .breadcrumb { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
    .breadcrumb span { cursor: pointer; }
    .breadcrumb span:hover { color: var(--accent); }

    .info-row { display: flex; gap: 24px; flex-wrap: wrap; }
    .info-item { display: flex; flex-direction: column; gap: 2px; }
    .info-item .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .info-item .val { font-size: 13px; font-weight: 500; }

    .shortcut-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg);
      border-radius: var(--radius);
      font-size: 11px;
      color: var(--muted);
    }
    .kbd {
      display: inline-block;
      padding: 1px 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .alert-warn { background: var(--warn-soft); color: #92400e; }
    .alert-fail { background: var(--fail-soft); color: #991b1b; }

    @media (max-width: 920px) {
      .sidebar { display: none; }
      .main-area { margin-left: 0; }
      .login-page { grid-template-columns: 1fr; }
      .login-brand { display: none; }
      .result-banner { flex-direction: column; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr !important; }
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  </style>
</head>

// ─── helpers ───
const StatusTag = ({ status }) => {
  const map = { pass: { cls: 'tag-pass', text: '通过' }, warn: { cls: 'tag-warn', text: '待确认' }, fail: { cls: 'tag-fail', text: '不通过' } };
  const s = map[status] || map.pass;
  return <span className={`tag ${s.cls}`}>{s.text}</span>;
};

const StatusBadge = ({ status }) => {
  const map = { pass: 'badge-pass', warn: 'badge-warn', fail: 'badge-fail' };
  return <span className={`badge ${map[status] || map.pass}`}></span>;
};

const countStatus = (items) => {
  const c = { pass: 0, warn: 0, fail: 0 };
  items.forEach(i => c[i.status]++);
  return c;
};

                          <rect x={0} y={200 - (pass + fail) * 1.8} width={36} height={fail * 1.8} fill="var(--status-fail)" rx={4} />
                          <text x={18} y={196} textAnchor="middle" fontSize="11" fill="var(--muted)">{name}</text>
                          <text x={18} y={200 - pass * 1.8 - 6} textAnchor="middle" fontSize="10" fill="var(--fg)">{pass}%</text>
                        </g>
                      );
                    })}
                    <line x1="20" y1="180" x2="480" y2="180" stroke="var(--border)" strokeDasharray="3 3" />
                    <text x="24" y="175" fontSize="10" fill="var(--muted)">目标线 90%</text>
                  </svg>
                </div>
              </div>
            </>
          )}

          {active === 'trends' && (
            <>
              <div className="breadcrumb">
                <span onClick={() => setActive('risk-list')}>风险清单</span>
                <span style={{ margin: '0 6px' }}>&gt;</span>
                <span style={{ color: 'var(--fg)', fontWeight: 500 }}>设备趋势</span>
              </div>
              <div className="card">
                <div style={{ fontWeight: 600, marginBottom: 12 }}>{selectedReport.deviceName} 介损劣化趋势（3年）</div>
                <div className="chart-placeholder" style={{ height: 260 }}>
                  <svg width="600" height="240" viewBox="0 0 600 240">
                    {['2023-04','2023-10','2024-04','2024-10','2025-04','2025-10','2026-04'].map((d, i) => (
                      <g key={d}>
                        <text x={60 + i * 80} y={230} textAnchor="middle" fontSize="10" fill="var(--muted)">{d}</text>
                      </g>
                    ))}
                    <polyline fill="none" stroke="var(--status-fail)" strokeWidth="2"
                      points="60,180 140,170 220,155 300,145 380,130 460,110 540,60" />
                    {[[60,180],[140,170],[220,155],[300,145],[380,130],[460,110],[540,60]].map(([x,y],i) => (
                      <circle key={i} cx={x} cy={y} r="4" fill="var(--status-fail)" />
                    ))}
                    <line x1="40" y1="195" x2="560" y2="195" stroke="var(--status-warn)" strokeDasharray="4 4" strokeWidth="1.5" />
                    <text x="45" y="190" fontSize="10" fill="var(--status-warn)">注意值 0.6%</text>
                    <line x1="40" y1="75" x2="560" y2="75" stroke="var(--status-fail)" strokeDasharray="4 4" strokeWidth="1.5" />
                    <text x="45" y="70" fontSize="10" fill="var(--status-fail)">警示值 0.7%</text>
                    <line x1="40" y1="20" x2="40" y2="220" stroke="var(--border)" />
                    <line x1="40" y1="220" x2="560" y2="220" stroke="var(--border)" />
                  </svg>
                </div>
                <div style={{ marginTop: 12, fontSize: 13, color: 'var(--muted)' }}>
                  该设备介损值从2023年的0.45%持续上升至2026年的0.85%，已超过警示值0.7%。建议安排B类检修并缩短试验周期。
                </div>
                <div style={{ marginTop: 16, display: 'flex', gap: 10 }}>
                  <button className="btn btn-secondary" onClick={() => setActive('risk-list')}>返回风险清单</button>
                  <button className="btn btn-primary" onClick={() => goToApproval(selectedReport)}>进入签字审批</button>
                </div>
              </div>
            </>
          )}

          {active === 'quality' && (
            <div className="card">
              <div style={{ fontWeight: 600, marginBottom: 12 }}>2026年4月质量通报</div>
              <table className="ds-table">
                <thead>
                  <tr><th>指标</th><th>本月</th><th>上月</th><th>变化</th></tr>
                </thead>
                <tbody>
                  <tr><td>报告总数</td><td className="num">156</td><td className="num">142</td><td className="num" style={{ color: 'var(--status-pass)' }}>+9.9%</td></tr>
                  <tr><td>一次通过率</td><td className="num">68.5%</td><td className="num">62.3%</td><td className="num" style={{ color: 'var(--status-pass)' }}>+6.2%</td></tr>
                  <tr><td>退回率</td><td className="num">8.2%</td><td className="num">12.5%</td><td className="num" style={{ color: 'var(--status-pass)' }}>-4.3%</td></tr>
                  <tr><td>平均审核时长</td><td className="num">4.2min</td><td className="num">5.8min</td><td className="num" style={{ color: 'var(--status-pass)' }}>-28%</td></tr>
                  <tr><td>AI预审准确率</td><td className="num">94.2%</td><td className="num">91.8%</td><td className="num" style={{ color: 'var(--status-pass)' }}>+2.4%</td></tr>
                </tbody>
              </table>
            </div>
          )}

          {active === 'approval' && (
            <>
              <div className="breadcrumb">
                <span onClick={() => setActive('risk-list')}>风险清单</span>
                <span style={{ margin: '0 6px' }}>&gt;</span>
                <span style={{ color: 'var(--fg)', fontWeight: 500 }}>终审签字</span>
              </div>
              {signed ? (
                <div className="card" style={{ textAlign: 'center', padding: 48 }}>
                  <div style={{ fontSize: 48, marginBottom: 16 }}>✓</div>
                  <h2 style={{ margin: '0 0 8px', fontSize: 20 }}>签字完成</h2>
                  <p style={{ color: 'var(--muted)', margin: '0 0 24px', fontSize: 13 }}>{selectedReport.id} 已终审通过</p>
                  <button className="btn btn-primary" onClick={() => setActive('risk-list')}>返回风险清单</button>
                </div>
              ) : (
                <div className="card" style={{ maxWidth: 640 }}>
                  <div style={{ fontWeight: 600, marginBottom: 16 }}>终审签字 — {selectedReport.id}</div>
                  <div style={{ marginBottom: 16, padding: 14, background: 'var(--bg)', borderRadius: 'var(--radius)', fontSize: 13 }}>
                    <div><strong>设备：</strong>{selectedReport.deviceName}</div>
                    <div style={{ marginTop: 4 }}><strong>审核结论：</strong><span style={{ color: selectedReport.aiResult === 'fail' ? 'var(--status-fail)' : 'var(--status-warn)' }}>{selectedReport.aiResult === 'fail' ? '不通过' : '待确认'}</span></div>
                    <div style={{ marginTop: 4 }}><strong>主要问题：</strong>{selectedReport.items.filter(i => i.status !== 'pass').map(i => `${i.name}(${i.value})`).join('、')}{selectedReport.contradiction ? '、数据与结论矛盾' : ''}</div>
                  </div>

                  <div className="card" style={{ background: 'var(--bg)', marginBottom: 16 }}>
                    <div style={{ fontWeight: 600, marginBottom: 10, fontSize: 13 }}>AI预审结果摘要</div>
                    {selectedReport.items.filter(i => i.status !== 'pass').map((item, i) => (
                      <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', fontSize: 12 }}>
                        <StatusTag status={item.status} />
                        <span>{item.name}：实测 {item.value}，标准 {item.threshold}</span>
                        <span style={{ color: 'var(--muted)', marginLeft: 'auto' }}>{item.standard}</span>
                      </div>
                    ))}
                  </div>

                  <div className="field">
                    <label>终审意见</label>
                    <textarea className="input" rows="3" defaultValue={selectedReport.aiResult === 'fail' ? '同意AI预审结论，数据超标明显，建议立即安排检修。' : '数据处于临界区，建议结合历史趋势综合判断，必要时缩短试验周期。'}></textarea>
                  </div>
                  <div style={{ border: '2px dashed var(--border)', borderRadius: 'var(--radius-lg)', padding: 32, textAlign: 'center', marginBottom: 16 }}>
                    <div style={{ fontSize: 28, marginBottom: 8 }}>✍</div>
                    <div style={{ fontSize: 13, color: 'var(--muted)' }}>在此区域手写电子签名</div>
                  </div>
                  <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                    <button className="btn btn-secondary" onClick={() => setActive('risk-list')}>退回重审</button>
                    <button className="btn btn-primary" onClick={() => setSigned(true)}>确认签字</button>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function SuccessPage({ onBack }) {
  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--bg)' }}>
      <div className="card" style={{ textAlign: 'center', maxWidth: 420, padding: 40 }}>
        <div style={{ fontSize: 56, marginBottom: 16 }}>✓</div>
        <h2 style={{ margin: '0 0 8px', fontSize: 22 }}>审核完成</h2>
        <p style={{ color: 'var(--muted)', margin: '0 0 24px', fontSize: 13 }}>报告 R-2026-0418-001 已成功审核</p>

        <div style={{ background: 'var(--bg)', borderRadius: 'var(--radius)', padding: 16, marginBottom: 24, textAlign: 'left' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px solid var(--border)' }}>
            <span style={{ color: 'var(--muted)', fontSize: 12 }}>审核时长</span>
            <span style={{ fontWeight: 500 }}>3分42秒</span>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0', borderBottom: '1px solid var(--border)' }}>
            <span style={{ color: 'var(--muted)', fontSize: 12 }}>发现问题</span>
            <span style={{ fontWeight: 500, color: 'var(--status-fail)' }}>2项异常 + 1项矛盾</span>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 0' }}>
            <span style={{ color: 'var(--muted)', fontSize: 12 }}>审核结论</span>
            <span style={{ fontWeight: 500, color: 'var(--status-fail)' }}>不通过</span>
          </div>
        </div>

        <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
          <button className="btn btn-secondary" onClick={onBack}>返回列表</button>
          <button className="btn btn-primary">导出PDF报告</button>
        </div>
      </div>
    </div>
  );
}

// ─── app ───
function App() {
  const [page, setPage] = React.useState('login');
  const [role, setRole] = React.useState(null);
  const [selectedReport, setSelectedReport] = React.useState(null);

  const handleLogin = (r) => {
    setRole(r);
    if (r === 'technician') setPage('technician');
    else if (r === 'reviewer') setPage('reviewer-list');
    else if (r === 'chief') setPage('chief');
  };

  const handleBack = () => {
    setPage('login');
    setRole(null);
    setSelectedReport(null);
  };

  const handleSelectReport = (r) => {
    setSelectedReport(r);
    setPage('reviewer-detail');
  };

  const handleComplete = () => {
    setPage('success');
  };

  switch (page) {
    case 'login': return <LoginPage onLogin={handleLogin} />;
    case 'technician': return <TechnicianPage onBack={handleBack} />;
    case 'reviewer-list': return <ReviewerListPage onSelect={handleSelectReport} onBack={handleBack} />;
    case 'reviewer-detail': return <ReviewerDetailPage report={selectedReport} onBack={() => setPage('reviewer-list')} onComplete={handleComplete} />;
    case 'chief': return <ChiefPage onBack={handleBack} />;
    case 'success': return <SuccessPage onBack={() => setPage('reviewer-list')} />;
    default: return <LoginPage onLogin={handleLogin} />;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
